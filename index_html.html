<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Закритий доступ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Odds">
<style>
:root { color-scheme: light dark; --bg:#eef2f6; --surface:#fff; --line:#d9e1e9; --fg:#14202b; --muted:#5b6b7b; --accent:#1479b5; --accent-fg:#fff; --bad:#b83232; }
@media (prefers-color-scheme: dark) { :root { --bg:#0e1621; --surface:#17212b; --line:#263444; --fg:#e8eef5; --muted:#8b9db0; --accent:#2aabee; --accent-fg:#04202f; --bad:#ef6b6b; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
form { width: 100%; max-width: 360px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:14px; }
h1 { margin:0; font-size:22px; }
p { margin:0; color:var(--muted); }
input[type=password] { width:100%; min-height:46px; padding:0 12px; font:inherit; font-size:16px; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:8px; }
label { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:14px; }
label input { width:18px; height:18px; accent-color:var(--accent); }
button { min-height:48px; font:inherit; font-weight:700; font-size:16px; background:var(--accent); color:var(--accent-fg); border:0; border-radius:10px; cursor:pointer; }
button:disabled { opacity:.6; }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#err { color:var(--bad); min-height:1.4em; font-size:14px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Закритий доступ</h1>
  <p>Введи пароль, щоб відкрити сторінку.</p>
  <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Пароль">
  <label><input id="rem" type="checkbox" checked> Запам'ятати на цьому пристрої</label>
  <button id="go" type="submit">Відкрити</button>
  <div id="err" role="alert"></div>
</form>

  const ITER = 600000;
  const KEY = 'locked-page-pw';
  const $ = s => document.querySelector(s);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function decrypt(pw) {
    const raw = b64(PAYLOAD), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
  }
  const show = html => { document.open(); document.write(html); document.close(); };
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch (_) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (_) {} },
    del() { try { localStorage.removeItem(KEY); } catch (_) {} },
  };

  if (!(window.crypto && crypto.subtle)) {
    $('#err').textContent = 'Цей браузер не підтримує розшифрування. Відкрий сторінку в Safari або Chrome через https.';
    $('#go').disabled = true;
    return;
  }

  async function tryOpen(pw, remember) {
    const html = await decrypt(pw);
    if (remember) store.set(pw);
    show(html);
  }

  $('#f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('#pw').value;
    if (!pw) return;
    const btn = $('#go');
    btn.disabled = true; btn.textContent = 'Перевіряю…'; $('#err').textContent = '';
    try { await tryOpen(pw, $('#rem').checked); }
    catch (_) { $('#err').textContent = 'Невірний пароль.'; btn.disabled = false; btn.textContent = 'Відкрити'; }
  });

  const saved = store.get();
  if (saved) tryOpen(saved, false).catch(() => store.del());
})();
</script>
