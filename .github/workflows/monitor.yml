name: monitor
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Моніторинг
        run: |
          f="$(ls bot*.mjs bot*.js 2>/dev/null | head -n1)"
          cp "$f" /tmp/bot.mjs
          node /tmp/bot.mjs monitor
        env:
          MAX_MINUTES: '345'
          MAX_PER_HOUR: '2'
          PAYOUT: '1.8'
          QUIET_HOURS: '23-8'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
